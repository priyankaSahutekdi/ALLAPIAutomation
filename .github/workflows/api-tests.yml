name: API Automation Tests

on:
  push:                       # run on every push to any branch
  pull_request:
    branches: [main]
  workflow_dispatch:          # allow manual runs from the Actions tab
    inputs:
      max_response_time:
        description: "Response-time limit in ms for timing assertions"
        required: false
        default: "3000"
  schedule:
    # 09:30 AM IST (Mon–Fri) == 04:00 UTC. GitHub cron is always UTC.
    - cron: "0 4 * * 1-5"

jobs:
  newman:
    name: Run Newman API tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run API test suite
        shell: pwsh
        env:
          # Manual runs can override the limit; scheduled/push runs fall back
          # to the maxResponseTime value in the environment file.
          MAX_RESPONSE_TIME: ${{ inputs.max_response_time }}
        run: ./run_all_folders.ps1

      - name: Upload HTML reports
        if: always()          # keep reports even when tests fail
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: test/reports/*.html
          retention-days: 30

      - name: Load email summary HTML
        if: always()
        id: summary
        shell: bash
        run: |
          {
            echo 'html<<__EMAIL_SUMMARY_EOF__'
            if [ -f test/reports/email-summary.html ]; then
              cat test/reports/email-summary.html
            else
              echo "<p>Summary report was not generated. See the run logs and attached reports.</p>"
            fi
            echo '__EMAIL_SUMMARY_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Choose email recipients
        if: always()
        id: recipients
        shell: bash
        run: |
          # Temporary narrow notification while the merge is being verified:
          # only the maintainer is emailed. At the cutover below the full
          # distribution list is restored automatically, so no follow-up
          # commit or manual edit is needed.
          #
          # Cutover: 2026-08-14 00:00 UTC == 05:30 IST, which is ahead of the
          # 09:30 IST scheduled run on Fri 14 Aug -- so that run, and every
          # run after it, goes to all 9 recipients.
          CUTOVER_EPOCH=1786665600
          MAINTAINER_ONLY="priyanka_s@tekditechnologies.com"
          FULL_LIST="priyanka_s@tekditechnologies.com,devendra.patil@tekditechnologies.com,gourav_m@tekditechnologies.com,satheesh@navadhiti.com,amol.chitale@tekditechnologies.com,suresh.kumar@ekstepplus.org,abhineet@ekstep.org,palani@navadhiti.com,sai@ekstep.org"

          NOW_EPOCH=$(date -u +%s)
          if [ "$NOW_EPOCH" -lt "$CUTOVER_EPOCH" ]; then
            RECIPIENTS="$MAINTAINER_ONLY"
            echo "Before cutover ($(date -u -d "@$CUTOVER_EPOCH" '+%Y-%m-%d %H:%M UTC')) - notifying maintainer only."
          else
            RECIPIENTS="$FULL_LIST"
            echo "Cutover passed - notifying the full distribution list."
          fi
          echo "Now: $(date -u '+%Y-%m-%d %H:%M UTC'). Recipients: $RECIPIENTS"
          echo "to=$RECIPIENTS" >> "$GITHUB_OUTPUT"

      - name: Send email notification
        if: always()          # notify on both success and failure
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "API Automation Tests: ${{ job.status }} (${{ github.ref_name }})"
          to: ${{ steps.recipients.outputs.to }}
          from: API Automation <${{ secrets.MAIL_USERNAME }}>
          html_body: ${{ steps.summary.outputs.html }}
          body: |
            API Automation Tests finished with status: ${{ job.status }}

            Repository: ${{ github.repository }}
            Branch/ref: ${{ github.ref_name }}
            Triggered by: ${{ github.event_name }}
            Commit: ${{ github.sha }}

            View the full run and download the HTML reports here:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: test/reports/*.html
